<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Bubble Tea | Menu</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo">TEA BAR</div>
        <nav>
            <ul>
                <li><a href="#fruit" class="active">Fruit Tea</a></li>
                <li><a href="#milk">Milk Tea</a></li>
                <li><a href="#seasonal">Seasonal</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="fruit">
            <h2 class="category-title">Fresh Fruit Series</h2>
            <div class="menu-grid">
                <div class="menu-item">
                    <div class="image-placeholder" style="background-color: #ffebd2;">
                        <span class="emoji">🥭</span>
                    </div>
                    <div class="item-info">
                        <h3>Mango Grapefruit Sago</h3>
                        <p>Fresh mango puree with pomelo and sago pearls.</p>
                        <span class="price">$7.50</span>
                    </div>
                </div>
                <div class="menu-item">
                    <div class="image-placeholder" style="background-color: #ffe4e1;">
                        <span class="emoji">🍓</span>
                    </div>
                    <div class="item-info">
                        <h3>Very Strawberry Cheezo</h3>
                        <p>Fresh strawberries topped with savory cheese foam.</p>
                        <span class="price">$8.00</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Visit us at our Downtown Location</p>
        <p>Mon-Sun: 11am - 10pm</p>
    </footer>

</body>
</html>
