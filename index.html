<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubble Tea Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>🧋 Molly's Bubble Tea</h1>
  <p>Fresh • Sweet • Customizable</p>
</header>

<nav>
  <button onclick="filterMenu('all')">All</button>
  <button onclick="filterMenu('milk')">Milk Tea</button>
  <button onclick="filterMenu('fruit')">Fruit Tea</button>
  <button onclick="filterMenu('topping')">Toppings</button>
</nav>

<section class="menu" id="menu">

  <div class="card milk">
    <h3>Classic Milk Tea</h3>
    <p>$5.50</p>
  </div>

  <div class="card milk">
    <h3>Taro Milk Tea</h3>
    <p>$6.00</p>
  </div>

  <div class="card fruit">
    <h3>Mango Green Tea</h3>
    <p>$5.75</p>
  </div>

  <div class="card fruit">
    <h3>Strawberry Tea</h3>
    <p>$5.75</p>
  </div>

  <div class="card topping">
    <h3>Pearls</h3>
    <p>$0.75</p>
  </div>

  <div class="card topping">
    <h3>Cheese Foam</h3>
    <p>$1.00</p>
  </div>

</section>

<footer>
  <p>Follow us on Instagram @mollybubbletea</p>
</footer>

<script src="script.js"></script>
</body>
</html>
